name: Daily AI News Automation

# 毎日12:00 UTC (日本時間21:00) に実行
# 日本時間の昼12:00-14:00に配信するには、3:00-5:00 UTCに実行
on:
  schedule:
    - cron: '0 4 * * *'  # 毎日 4:00 UTC = 日本時間 13:00
  workflow_dispatch:  # 手動実行も可能

jobs:
  collect-and-send-news:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install notion-client requests beautifulsoup4 feedparser
    
    - name: Run AI News Collector
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      run: |
        python ai_news_collector_v2.py
    
    - name: Send Email Notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: 🤖 AIニュースサマリー - ${{ env.TODAY }}
        to: ${{ secrets.RECIPIENT_EMAIL }}
        from: AI News Bot <${{ secrets.MAIL_USERNAME }}>
        body: file://email_body.txt
        content_type: text/plain
      continue-on-error: true
